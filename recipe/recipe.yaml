schema_version: 1

context:
  version: "2610.0.0"
  build_number: "0"

package:
  name: metadata-crawler
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/metadata-crawler/metadata_crawler-${{ version }}.tar.gz
  sha256: b8215ae2e5140d1d16fac5142274e1c695391785cfd28c6e659eeba452260670

build:
  number: ${{ build_number }}
  skip:
    - match(python, "<3.11")
  python:
    entry_points:
      - mdc = metadata_crawler.cli:cli
      - metadata-crawler = metadata_crawler.cli:cli

requirements:
  host:
    - python >=3.11
    - maturin >=1.10,<2.0
    - pip
  run:
    - python >=3.11
    - rich-argparse
    - aiohttp
    - ciso8601
    - cryptography
    - fsspec
    - diskcache
    - s3fs
    - jinja2
    - intake
    - intake-xarray
    - intake-esm
    - pandas
    - python-dateutil
    - platformdirs
    - psycopg [binary]
    - numpy
    - orjson
    - pyarrow
    - pymongo
    - h5netcdf
    - h5py
    - pyrage
    - pydantic
    - pyarrow
    - rich
    - rtoml
    - sqlalchemy
    - tomlkit
    - typing-extensions
    - zarr
    - xarray
    - ${{ "uvloop" if not win }}
    - httpx

tests:
  - python:
      imports:
        - metadata_crawler
      pip_check: true

about:
  summary: Crawl, extract and push climate metadata for indexing.
  description: |
    Harvest, normalise, and index climate / earth-system metadata from POSIX,
    S3/MinIO, and OpenStack Swift using configurable DRS dialects (CMIP6, CMIP5,
    CORDEX, …). Output to a temporary source of truth (JSONLines, PostgresDB)
    and then index into systems such as Solr or MongoDB. Configuration is TOML
    with inheritance, templating, and computed rules.
  license: BSD-3-Clause
  license_file:
    - LICENSE
  documentation: https://metadata-crawler.readthedocs.io
extra:
  recipe-maintainers:
    - antarcticrainforest
    - tropicrainforest
